# Copy to secret.yaml (gitignored) and fill values. Do not commit the filled file.
#   cp deploy/openshift/secret.example.yaml deploy/openshift/secret.yaml
#   oc -n counterpart apply -f deploy/openshift/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: counterpart-secrets
  namespace: counterpart
  labels:
    app.kubernetes.io/name: counterpart
type: Opaque
stringData:
  SESSION_SECRET: "replace-with-openssl-rand-hex-32"
  POSTGRES_PASSWORD: "replace-with-strong-db-password"
  DATABASE_URL: "postgres://clause:replace-with-strong-db-password@postgres:5432/clause"
  STORAGE_SECRET_KEY: "replace-with-strong-minio-password"
  # Required by the app even for local vLLM (send any non-empty token the inference server accepts).
  AI_API_KEY: "replace-with-inference-or-gateway-token"
  AI_EMBEDDING_API_KEY: ""
  CRON_SECRET: "replace-with-random"
  APP_URL: "https://counterpart.example.openshiftapps.com"
