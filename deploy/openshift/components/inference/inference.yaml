apiVersion: v1
kind: ConfigMap
metadata:
  name: inference-config
  namespace: counterpart
  labels:
    app.kubernetes.io/name: counterpart
    app.kubernetes.io/component: inference
data:
  # Hugging Face model id served by vLLM (OpenAI-compatible /v1).
  INFERENCE_MODEL: "Qwen/Qwen2.5-7B-Instruct"
  HUGGING_FACE_HUB_CACHE: "/models"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: inference-models
  namespace: counterpart
  labels:
    app.kubernetes.io/name: counterpart
    app.kubernetes.io/component: inference
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: inference
  namespace: counterpart
  labels:
    app.kubernetes.io/name: counterpart
    app.kubernetes.io/component: inference
spec:
  selector:
    app.kubernetes.io/name: counterpart
    app.kubernetes.io/component: inference
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference
  namespace: counterpart
  labels:
    app.kubernetes.io/name: counterpart
    app.kubernetes.io/component: inference
    app.kubernetes.io/part-of: gptlab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: counterpart
      app.kubernetes.io/component: inference
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: counterpart
        app.kubernetes.io/component: inference
        app.kubernetes.io/part-of: gptlab
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          command: ["/bin/sh", "-c"]
          args:
            - exec python3 -m vllm.entrypoints.openai.api_server --model "$INFERENCE_MODEL" --host 0.0.0.0 --port 8000
          envFrom:
            - configMapRef:
                name: inference-config
          env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: counterpart-secrets
                  key: HUGGING_FACE_HUB_TOKEN
                  optional: true
          ports:
            - containerPort: 8000
              name: http
          volumeMounts:
            - name: models
              mountPath: /models
          resources:
            requests:
              cpu: "4"
              memory: 32Gi
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
              memory: 64Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 30
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: inference-models
