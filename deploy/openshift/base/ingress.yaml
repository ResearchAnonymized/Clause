# Vanilla Kubernetes Ingress (skip this file on OpenShift; use route.yaml instead).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: counterpart
  namespace: counterpart
  labels:
    app.kubernetes.io/name: counterpart
    app.kubernetes.io/component: app
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
spec:
  ingressClassName: nginx
  rules:
    - host: counterpart.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: counterpart-app
                port:
                  number: 3000
  tls:
    - hosts:
        - counterpart.example.com
      secretName: counterpart-tls
