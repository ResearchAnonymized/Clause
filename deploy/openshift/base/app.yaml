apiVersion: v1
kind: Service
metadata:
  name: counterpart-app
  namespace: counterpart
  labels:
    app.kubernetes.io/name: counterpart
    app.kubernetes.io/component: app
spec:
  selector:
    app.kubernetes.io/name: counterpart
    app.kubernetes.io/component: app
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: counterpart-app
  namespace: counterpart
  labels:
    app.kubernetes.io/name: counterpart
    app.kubernetes.io/component: app
    app.kubernetes.io/part-of: gptlab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: counterpart
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: counterpart
        app.kubernetes.io/component: app
        app.kubernetes.io/part-of: gptlab
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: counterpart-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: counterpart-config
            - secretRef:
                name: counterpart-secrets
          readinessProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
