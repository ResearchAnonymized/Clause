name: Worker Integration Tests

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      load_runs:
        description: "Load test: number of concurrent runs"
        default: "10"
      load_timeout:
        description: "Load test: per-run timeout (s)"
        default: "600"

concurrency:
  group: worker-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e-and-load:
    name: E2E + short load test against real Python worker
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Worker (required GitHub secrets)
      WORKER_URL: ${{ secrets.WORKER_URL }}
      WORKER_HMAC_SECRET: ${{ secrets.WORKER_HMAC_SECRET }}
      # Supabase (required GitHub secrets)
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      # Test scope (required GitHub secrets)
      TEST_WORKSPACE_ID: ${{ secrets.TEST_WORKSPACE_ID }}
      TEST_CRITERIA_SET_ID: ${{ secrets.TEST_CRITERIA_SET_ID }}
      # Optional: published app URL for UI-layer assertions
      APP_URL: ${{ secrets.APP_URL }}
      # Sample fixtures committed under worker/tests/fixtures/
      SAMPLE_CUSTOMER_PATH: worker/tests/fixtures/2m-it-customer.pdf
      SAMPLE_SUPPLIER_PATH: worker/tests/fixtures/2m-it-supplier.pdf

    steps:
      - name: Guard — required secrets are configured
        run: |
          missing=0
          for name in WORKER_URL WORKER_HMAC_SECRET SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_PUBLISHABLE_KEY TEST_WORKSPACE_ID TEST_CRITERIA_SET_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: $name"
              missing=1
            fi
          done
          exit $missing

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          pip install --no-cache-dir httpx supabase playwright
          python -m playwright install --with-deps chromium

      - name: Fixtures present
        run: |
          test -f "$SAMPLE_CUSTOMER_PATH" || { echo "::error::missing $SAMPLE_CUSTOMER_PATH"; exit 1; }
          test -f "$SAMPLE_SUPPLIER_PATH" || { echo "::error::missing $SAMPLE_SUPPLIER_PATH"; exit 1; }

      - name: Worker health
        run: curl -fsS "$WORKER_URL/health"

      - name: E2E — real worker against 2M-IT sample (+ UI parity)
        working-directory: worker/tests
        run: python e2e_2mit.py

      - name: Short load test (10 concurrent runs)
        working-directory: worker/tests
        run: |
          python load_test.py \
            --runs "${{ github.event.inputs.load_runs || '10' }}" \
            --timeout "${{ github.event.inputs.load_timeout || '600' }}"

      - name: Playwright UI smoke — latest completed run
        if: env.APP_URL != '' && env.TEST_USER_EMAIL != '' && env.TEST_USER_PASSWORD != ''
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        working-directory: worker/tests
        run: python ui_smoke.py

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-integration-reports
          path: |
            worker/tests/last-load-report.json
            worker/tests/last-e2e-report.json
            worker/tests/screenshots/**
          if-no-files-found: ignore
